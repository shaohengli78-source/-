<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="{{ session.csrf }}"><title>智存管理台 · 实验室智能寄存锁</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><script defer src="{{ url_for('static',filename='app.js') }}"></script></head><body><aside class="sidebar"><a class="brand" href="/admin"><span class="brand-icon">智</span><span>智存管理台<small>LAB LOCKER</small></span></a><p class="nav-caption">工作空间</p><nav><button class="nav active" data-view="lockers">▦ <span>柜子总览</span></button><button class="nav" data-view="students">♙ <span>授权学生</span></button><button class="nav" data-view="usage">↗ <span>使用统计</span></button><button class="nav" data-view="commands">⇄ <span>设备指令</span></button><button class="nav" data-view="audit">≡ <span>操作日志</span></button></nav><div class="sidebar-bottom"><span class="status-dot"></span> 管理员工作空间<p>普通柜子 · 智能连接</p></div></aside><main class="main"><header class="topbar"><span>实验室 / 资源管理</span><div><span class="avatar">管</span> {{ session.admin }} <button class="text-button" id="password">改密码</button><button class="text-button" id="logout">退出</button></div></header><div class="content"><div class="page-heading"><div><p class="eyebrow">SMART STORAGE MANAGEMENT</p><h1 id="page-title">柜子总览</h1><p id="page-subtitle" class="muted">查看资源状态，让实验室的每一格物尽其用。</p></div><button id="refresh">↻ 刷新数据</button></div><div class="stats"><article><span>全部柜子</span><strong id="total">—</strong><small>已登记资源</small></article><article><span>使用中</span><strong id="occupied">—</strong><small>当前已分配</small></article><article><span>空闲柜子</span><strong id="free">—</strong><small>可供学生使用</small></article><article><span>累计使用</span><strong id="uses">—</strong><small>每次分配计为一次</small></article></div><div id="notice" role="status" aria-live="polite" hidden></div><section class="panel"><div class="toolbar"><div class="filter-group"><input id="search" type="search" placeholder="搜索柜号 / 姓名 / 学号" aria-label="搜索"><select id="filter" aria-label="柜子状态"><option value="all">全部状态</option><option value="free">空闲</option><option value="occupied">已占用</option></select></div><div class="actions"><button id="add-student" hidden>＋ 登记学生</button><button id="add-locker" class="primary">＋ 添加柜子</button><a id="export" class="button" href="/api/export/statistics" hidden>↓ 导出 CSV</a></div></div><div id="period" class="period" hidden><label>统计开始<input id="date-from" type="date"></label><label>统计结束<input id="date-to" type="date"></label><button id="apply-period">应用日期</button><span class="muted">按使用开始日期统计，可选择学期起止日期</span></div><div id="view"></div><footer class="panel-footer"><span id="count">正在读取数据…</span><span id="updated">—</span></footer></section><p class="footnote">开锁与初始化仅管理员可发起；设备回执决定执行结果。页面每 15 秒更新。</p></div></main><dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><form id="modal-form"><div id="fields"></div><p id="form-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit" id="submit">保存</button></div></form></dialog></body></html>
